<div class="flex items-start mb-4">
    <div>
        <h3 class="text-gray-800 text-base font-bold">
            {% with donor_name=donation.supporter.full_name, donor_anonymous=not donation.public %}
                {% include "snippets/donor-name.html" %}
            {% endwith %}
            <span class="font-normal">ha donato</span> {{ donation.amount }}€
        </h3>

        <div class="text-sm text-gray-500">
            {{ donation.create_date.strftime('%d/%m/%Y') }}
        </div>
    </div>
</div>
